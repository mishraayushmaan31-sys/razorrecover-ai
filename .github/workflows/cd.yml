name: Continuous Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy Container to ECS
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-deploy-role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Tag Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: razorrecover
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma migrate deploy

      - name: Deploy Task to Amazon ECS
        run: |
          aws ecs update-service \
            --cluster razorrecover-${{ github.event.inputs.environment || 'production' }}-cluster \
            --service razorrecover-${{ github.event.inputs.environment || 'production' }}-service \
            --force-new-deployment

      - name: Await Service Stability & Verify Health
        run: |
          aws ecs wait services-stable \
            --cluster razorrecover-${{ github.event.inputs.environment || 'production' }}-cluster \
            --services razorrecover-${{ github.event.inputs.environment || 'production' }}-service
          
          echo "Verifying endpoint health..."
          curl --fail --retry 5 --retry-delay 5 https://${{ vars.APP_DOMAIN }}/api/health || exit 1

