name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/razorrecover
      SESSION_SECRET: ci-test-environment-session-secret-at-least-32-chars
      RAZORPAY_KEY_ID: rzp_test_placeholder_for_ci
      RAZORPAY_KEY_SECRET: local_test_secret
      RAZORPAY_WEBHOOK_SECRET: local_webhook_secret
      ENABLE_DEMO_MODE: 'true'
      ENABLE_TEST_MODE: 'true'
      ENABLE_PRODUCTION_MODE: 'false'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Check Code Formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Vitest Test Suites
        run: npm test

      - name: Validate Next.js Production Build
        run: npm run build

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=critical || true
