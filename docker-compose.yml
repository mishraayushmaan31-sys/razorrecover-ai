services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: razorrecover
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - razorrecover-postgres:/var/lib/postgresql/data

  app:
    build: .
    environment:
      NODE_ENV: production
      APP_ENV: demo
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/razorrecover
    ports:
      - '3000:3000'
    depends_on:
      - postgres

volumes:
  razorrecover-postgres:
